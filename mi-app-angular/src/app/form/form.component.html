<div class="form-shell">
  <div class="form-card">
    <div class="form-hero">
      <div class="icon-badge">✦</div>
      <h1>Únete a nosotros</h1>
      <p>Completa tus datos y crea tu cuenta en minutos.</p>
    </div>

    <form [formGroup]="singUpForm" (ngSubmit)="saveData()" class="modern-form">
      <div class="form-group">
        <label for="name">Nombre</label>
        <input type="text" id="name" formControlName="name" placeholder="Tu nombre completo" />
        <small *ngIf="f.name.errors?.required && f.name.touched" class="error">
          El nombre es obligatorio.
        </small>
        <small *ngIf="f.name.errors?.minlength && f.name.touched" class="error">
          Mínimo 3 caracteres.
        </small>
      </div>

      <div class="form-group">
        <label for="age">Edad</label>
        <input type="number" id="age" formControlName="age" placeholder="18" />
        <small *ngIf="f.age.errors?.required && f.age.touched" class="error">
          La edad es obligatoria.
        </small>
        <small *ngIf="f.age.errors?.min && f.age.touched" class="error">
          La edad debe ser mayor o igual a 18.
        </small>
        <small *ngIf="f.age.errors?.max && f.age.touched" class="error">
          La edad debe ser menor o igual a 99.
        </small>
      </div>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" formControlName="email" placeholder="tuemail@dominio.com" />

        <small *ngIf="f.email.errors?.required && f.email.touched" class="error">
          El email es obligatorio.
        </small>
        <small *ngIf="f.email.errors?.email && f.email.touched" class="error">
          Formato de email inválido.
        </small>
      </div>

      <div formGroupName="address" class="address-group">
        <h3>Datos de ubicación</h3>

        <div class="form-group">
          <label for="street">Calle</label>
          <input type="text" id="street" formControlName="street" placeholder="Av. Principal 123" />
        </div>

        <div class="form-group">
          <label for="city">Ciudad</label>
          <input type="text" id="city" formControlName="city" placeholder="Bogotá" />
        </div>
      </div>

      <button type="submit">Registrar ahora</button>
    </form>
  </div>
</div>
