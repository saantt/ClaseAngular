<h2>Personajes</h2>

<div style="margin-bottom: 16px;">
  <input
    type="text"
    [(ngModel)]="searchTerm"
    placeholder="Buscar por nombre"
    (keyup.enter)="searchByName()"
  />
  <button type="button" (click)="searchByName()">Buscar</button>
</div>

<p *ngIf="loading">Cargando personajes...</p>
<p *ngIf="error">Ocurrio un error al consultar la API.</p>

<div class="character-grid" *ngIf="!loading && !error">
  <a class="character-card" *ngFor="let character of characters" [routerLink]="[character.id]">
    <img [src]="character.image" [alt]="character.name" />
    <h3>{{ character.name }}</h3>
    <p>{{ character.species }} · {{ character.status }}</p>
  </a>
</div>
