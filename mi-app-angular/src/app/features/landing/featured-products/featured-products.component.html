<section id="productos" class="featured-products">
  <app-section-title
    eyebrow="Lo más vendido"
    title="Colección hecha para destacar"
    subtitle="Prendas seleccionadas con calidad, detalle y estilo sin esfuerzo."
  ></app-section-title>

  <div class="product-grid">
    <app-product-card
      *ngFor="let product of products"
      [title]="product.title"
      [description]="product.description"
      [price]="product.price"
      [image]="product.image"
    ></app-product-card>
  </div>
</section>
