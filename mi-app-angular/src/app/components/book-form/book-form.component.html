<form [formGroup]="bookForm" (ngSubmit)="saveData()">
    <div>
        <label>Title</label>
        <input type="text" formControlName="title" placeholder="Book title">

        <small *ngIf="f.title.touched && f.title.errors?.required">

            Title is required.
        </small>
        <small *ngIf="f.title.touched && f.title.errors?.minlength">
            Minimum length is 3 characters.
        </small>
    </div>
    <div>
        <label>Author</label>
        <input type="text" formControlName="author" placeholder="Author">
        <small *ngIf="f.author.touched && f.author.errors?.required">
            Author is required.
        </small>
    </div>
    <div>
        <label>Category</label>
        <select formControlName="category">
            <option value="">Select category</option>
            <option value="Programming">Programming</option>
            <option value="Novel">Novel</option>
            <option value="History">History</option>
            <option value="Science">Science</option>
        </select>
        <small *ngIf="f.category.touched && f.category.errors?.required">
            Category is required.
        </small>
    </div>
    <button type="submit" [disabled]="bookForm.invalid">
        Add Book
    </button>
</form>
