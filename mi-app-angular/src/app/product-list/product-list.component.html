<div class="container">
  <!-- Encabezado -->
  <header class="header">
    <h1>🛍️ Galería de Productos</h1>
    <div class="cart-summary">
      <span class="cart-count">{{ getTotalItems() }} items</span>
      <span class="cart-total">${{ getTotalPrice() | number: "1.2-2" }}</span>
    </div>
  </header>

  <!-- Contenido principal -->
  <div class="main-content">
    <!-- Barra lateral: Filtros -->
    <aside class="sidebar">
      <button
        *ngFor="let category of getCategories()"
        class="filter-btn"
        [class.active]="filter === category"
        (click)="filter = category"
      >
        {{ category === "all" ? "Todos" : category }}
      </button>
    </aside>

    <!-- Área principal: Grid de productos -->
    <main class="products-area">
      <div class="products-grid">
        <!-- Pasamos datos al hijo con @Input y escuchamos eventos con @Output -->
        <app-product-card
          *ngFor="let product of getFilteredProducts()"
          [product]="product"
          [isInCart]="isInCart(product.id)"
          (addToCart)="onAddToCart($event)"
          (removeFromCart)="onRemoveFromCart($event)"
          (viewDetails)="onViewDetails($event)"
        >
        </app-product-card>
      </div>
    </main>

    <!-- Barra lateral: Carrito -->
    <aside class="cart-sidebar">
      <app-product-cart [cartItems]="cartItems" [totalPrice]="getTotalPrice()">
      </app-product-cart>
    </aside>
  </div>

  <!-- Modal: Detalles del producto -->
  <div class="modal" *ngIf="showDetails">
    <div class="modal-content">
      <button class="close-btn" (click)="closeDetails()">✕</button>
      <div *ngIf="selectedProduct" class="details-content">
        <img [src]="selectedProduct.image" [alt]="selectedProduct.name" />
        <h2>{{ selectedProduct.name }}</h2>
        <p>{{ selectedProduct.description }}</p>
        <p><strong>Precio:</strong> ${{ selectedProduct.price }}</p>
        <p><strong>Categoría:</strong> {{ selectedProduct.category }}</p>
        <p><strong>Stock disponible:</strong> {{ selectedProduct.stock }}</p>
      </div>
    </div>
  </div>
</div>
